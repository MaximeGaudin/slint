# cargo-deny configuration for slint
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Every unmaintained crate fails the check, direct or transitive; the ones we
# cannot move yet are listed below with reasons and an expiry date.
unmaintained = "all"
ignore = [
    # Transitive via extism 1.30, which pins wasmtime ^43. RUSTSEC-2026-0222
    # (GHSA-hgjw-h833-99q9) is patched only in >= 46.0.2 and >= 47.0.3; no
    # 43.x release fixes it, and extism 1.30.0 is the newest extism release,
    # so no bump is possible until extism itself moves. Time-boxed: CI fails
    # when the date below passes, forcing a re-evaluation (extism on a
    # patched wasmtime, or a local patch).
    # expires: 2026-10-31
    { id = "RUSTSEC-2026-0222", reason = "wasmtime 43.x has no patched release; owned by extism 1.30" },
    # Archived upstream; pulled in via wasm-compose → wasmtime 43, which extism 1.30 pins.
    # No alternative on this path until extism moves. Re-evaluate when the date passes.
    # expires: 2026-10-31
    { id = "RUSTSEC-2026-0247", reason = "bitmaps: transitive via wasmtime (wasm-compose); archived upstream" },
    # Archived upstream; pulled in via wasm-compose → wasmtime 43, which extism 1.30 pins.
    # No alternative on this path until extism moves. Re-evaluate when the date passes.
    # expires: 2026-10-31
    { id = "RUSTSEC-2026-0250", reason = "im-rc: transitive via wasmtime (wasm-compose); archived upstream" },
    # Archived upstream; pulled in via im-rc → wasm-compose → wasmtime 43, which extism 1.30 pins.
    # No alternative on this path until extism moves. Re-evaluate when the date passes.
    # expires: 2026-10-31
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks: transitive via wasmtime (wasm-compose); archived upstream" },
    # Archived upstream; proc-macro dependency of genai 0.6.5. Re-evaluate on the
    # next genai bump.
    # expires: 2026-10-31
    { id = "RUSTSEC-2024-0436", reason = "paste: proc-macro dep of genai; archived upstream" },
]

[licenses]
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
