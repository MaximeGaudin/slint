[workspace]
resolver = "2"
members = [
    "packages/core",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MaximeGaudin/agent-slint"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
extism = "1.30.0"
genai = "0.6.5"
globset = "0.4.20"
owo-colors = "4.3.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.4"
ureq = "3.4.0"
walkdir = "2.5.0"
tempfile = "3.15.0"
slint = { path = "packages/core" }
