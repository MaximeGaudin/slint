name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.actor == 'dependabot[bot]' }}
          cache-on-failure: true

      - name: Clippy
        if: matrix.os != 'windows-latest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Todo / stub comment check
        if: runner.os != 'Windows'
        run: node scripts/check-no-todos.mjs

      - name: Test
        run: cargo test --workspace --locked

      # Guards the README promise that the docs site and the binary never
      # disagree about the rule catalogue (#127).
      - name: Verify rules.json matches the binary
        if: runner.os == 'Linux'
        run: ./scripts/check-rules-json.sh

  js:
    name: JS lint
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint docs + vscode
        run: pnpm exec turbo run lint --filter=slint-docs --filter=slint-vscode
      - name: Test vscode
        run: pnpm exec turbo run test --filter=slint-vscode
      - name: Package vscode (validate the manifest)
        run: pnpm package:vscode

  msrv:
    name: MSRV
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b  # 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.actor == 'dependabot[bot]' }}
      - name: Check
        run: cargo check --workspace --locked

  deny:
    name: cargo-deny
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check

      - name: Advisory ignore deadlines
        run: node scripts/check-ignore-deadlines.mjs

  coverage:
    name: Coverage
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.actor == 'dependabot[bot]' }}
      - uses: taiki-e/install-action@562f912bf8a1174eb1007c4afe216a9187a8d722  # cargo-llvm-cov
      - name: Generate coverage
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
          RUST_TEST_THREADS: 1
        run: >
          cargo llvm-cov --workspace --locked --summary-only
          --ignore-filename-regex='/.cargo/|/rustc/'
          --fail-under-lines 92
