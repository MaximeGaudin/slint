name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. 0.1.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag }}

      - name: Compare tag with workspace version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          WORKSPACE_VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::Tag ${TAG} (version ${VERSION}) does not match workspace version ${WORKSPACE_VERSION} in Cargo.toml"
            exit 1
          fi
          echo "Tag ${TAG} matches workspace version ${WORKSPACE_VERSION}"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: verify-tag
    permissions:
      contents: read
      actions: write
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: slint-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: slint-darwin-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: slint-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: slint-linux-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: slint-linux-amd64-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: slint-linux-arm64-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: slint-windows-amd64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked -p slint-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ matrix.artifact }}.tar.gz slint
          mv ${{ matrix.artifact }}.tar.gz ../../../

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ReleaseDir = "target/${{ matrix.target }}/release"
          $Binary = Join-Path $ReleaseDir "slint.exe"
          $Archive = "${{ matrix.artifact }}.zip"
          Compress-Archive -Path $Binary -DestinationPath $Archive -Force

      - name: Checksum (Unix)
        if: runner.os != 'Windows'
        run: sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}.zip").Hash.ToLower()
          Set-Content -Path "${{ matrix.artifact }}.zip.sha256" -Value "$hash  ${{ matrix.artifact }}.zip"

      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22  # v4.1.0

      - name: Sign artifact (keyless Sigstore)
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          case "$ARTIFACT" in
            *.zip) FILE="$ARTIFACT.zip" ;;
            *)     FILE="$ARTIFACT.tar.gz" ;;
          esac
          cosign sign-blob --yes \
            --output-signature "$FILE.sig" \
            --output-certificate "$FILE.cert" \
            --bundle "$FILE.bundle" \
            "$FILE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          retention-days: 1

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > /tmp/release-notes.md
          echo "--- Release notes ---"
          cat /tmp/release-notes.md

      - name: Add third-party notices
        run: cp THIRD-PARTY-NOTICES.md artifacts/

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"

          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" --draft --title "v${TAG}" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --draft --title "v${TAG}" --notes-file /tmp/release-notes.md
          fi

  vscode:
    name: Package and publish VS Code extension
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11.21.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm exec turbo run build --filter=slint-vscode

      - name: Package extension
        run: pnpm --filter slint-vscode package

      - name: Attach .vsix to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX=$(ls apps/vscode/*.vsix)
          echo "Packaged: ${VSIX}"
          gh release upload "${{ inputs.tag }}" "${VSIX}" --clobber

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::VSCE_PAT not set — skipping VS Code Marketplace publish."
            exit 0
          fi
          pnpm --filter slint-vscode publish:marketplace

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT not set — skipping Open VSX publish."
            exit 0
          fi
          pnpm --filter slint-vscode publish:openvsx

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Update formula in MaximeGaudin/homebrew-tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set — the Homebrew tap update cannot run. Add a read/write deploy key for MaximeGaudin/homebrew-tap as the HOMEBREW_TAP_DEPLOY_KEY secret, or remove the homebrew job from release.yml."
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          if ! git ls-remote git@github.com:MaximeGaudin/homebrew-tap.git HEAD &>/dev/null; then
            echo "::error::Could not reach MaximeGaudin/homebrew-tap over SSH. Check that the repo exists and that HOMEBREW_TAP_DEPLOY_KEY grants read/write access."
            exit 1
          fi

          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          ARM_SHA=$(sha256sum artifacts/slint-darwin-arm64.tar.gz | cut -d' ' -f1)
          AMD_SHA=$(sha256sum artifacts/slint-darwin-amd64.tar.gz | cut -d' ' -f1)
          LINUX_ARM_SHA=$(sha256sum artifacts/slint-linux-arm64.tar.gz | cut -d' ' -f1)
          LINUX_AMD_SHA=$(sha256sum artifacts/slint-linux-amd64.tar.gz | cut -d' ' -f1)

          git clone --depth 1 git@github.com:MaximeGaudin/homebrew-tap.git tap
          mkdir -p tap/Formula
          cat > tap/Formula/slint.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          # Auto-generated by the slint release workflow. Do not edit by hand.
          class Slint < Formula
            desc "The linter for Agent Skills"
            homepage "https://github.com/MaximeGaudin/slint"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/MaximeGaudin/slint/releases/download/${TAG}/slint-darwin-arm64.tar.gz"
                sha256 "${ARM_SHA}"
              end
              on_intel do
                url "https://github.com/MaximeGaudin/slint/releases/download/${TAG}/slint-darwin-amd64.tar.gz"
                sha256 "${AMD_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/MaximeGaudin/slint/releases/download/${TAG}/slint-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end
              on_intel do
                url "https://github.com/MaximeGaudin/slint/releases/download/${TAG}/slint-linux-amd64.tar.gz"
                sha256 "${LINUX_AMD_SHA}"
              end
            end

            def install
              bin.install "slint"
            end

            test do
              assert_match "slint", shell_output("#{bin}/slint --version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/slint.rb
          if git diff --cached --quiet; then
            echo "Formula/slint.rb already at version ${VERSION} — nothing to push."
          else
            git commit -m "slint ${VERSION}"
            git push
          fi

          git clone --depth 1 git@github.com:MaximeGaudin/homebrew-tap.git tap-verify
          if ! grep -q "version \"${VERSION}\"" tap-verify/Formula/slint.rb; then
            echo "::error::Formula/slint.rb on MaximeGaudin/homebrew-tap does not advertise version ${VERSION} after push."
            exit 1
          fi
          echo "Verified: Formula/slint.rb on MaximeGaudin/homebrew-tap is at version ${VERSION}."
